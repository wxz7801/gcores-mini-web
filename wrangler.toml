# Cloudflare Pages 本地预览 / 部署配置
#
# 本地预览：  pnpm --dir apps/web build && npx wrangler pages dev
# 产物目录由 pages_build_output_dir 指定，wrangler pages dev 会自动读取。
#
# 注意（踩过的坑）：
#   1. Pages 配置里不能再写 [assets] 段——workers 的 assets 必须提供 directory，
#      而 Pages 的目录由 pages_build_output_dir 给出，两者混用会直接报错。
#   2. SPA 回退不要在 apps/web/public/_redirects 里写 `/* /index.html 200`：
#      html_handling 默认开启时这条会被判为「Infinite loop」而静默忽略。
#      正确做法是在 Cloudflare Dashboard 的 Pages 项目里设置
#      Build output directory = apps/web/dist，并依赖 Pages 默认的 SPA 回退
#      （或在变更为 Workers 架构后用 assets.not_found_handling = "single-page-application"）。
#      深链 /radio/123、/series/recorder 已实测可直接刷新。

name = "gcores-mini-web"
pages_build_output_dir = "apps/web/dist"
compatibility_date = "2026-11-09"